server.port=8080
server.error.include-message=always

# File-based H2 database (data is kept in ./data between restarts)
spring.datasource.url=jdbc:h2:file:./data/sms
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Uploaded files are saved in this folder (videos/, materials/ and submissions/ inside it)
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# The single admin account (students get their logins generated automatically)
app.admin.username=admin
app.admin.password=admin123
